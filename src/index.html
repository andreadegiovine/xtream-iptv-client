<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" /> <!-- no initial-scale: on Android it overrode the page fitted to the screen (overview mode) -->
    <title>Xtream IPTV</title>
    <% if (htmlWebpackPlugin.options.includeWebapis) { %>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <% } %>
  </head>
  <body>
    <div id="topbar"></div>
    <main id="content"><div class="boot-splash"><%= htmlWebpackPlugin.options.logoSvg.trim().replace(/logo-cb/g, 'splash-cb') %></div></main> <!-- the first page replaces the splash -->
    <script>
      // Loader (src/boot/loader.js): the package's own copy, or an update kept on the device (two slots, see src/services/slotUpdates.js).
      <%= htmlWebpackPlugin.options.loaderScript %>
      window.__XI_LOADER__.start({
        shell: '<%= htmlWebpackPlugin.options.appVersion %>',
        autoupdate: <%= htmlWebpackPlugin.options.autoupdate ? 'true' : 'false' %>, // only the "_autoupdate" packages keep updates
        js: <%= JSON.stringify(htmlWebpackPlugin.files.js) %>,
        css: <%= JSON.stringify(htmlWebpackPlugin.files.css) %>,
      });
    </script>
  </body>
</html>
